[project]
name = "alphablock"
version = "0.1.0"
description = "오더블록 기반 암호화폐 자동매매 (AlphaBlock)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.0.0",
    "matplotlib>=3.8.0",
    "pandas>=2.0.0",
    "plotly>=6.9.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.59.1",
    "websockets>=12.0",
]

[dependency-groups]
dev = [
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "pytest>=8.0.0",
]

[project.scripts]
alphablock = "cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common", "config", "data", "strategy", "execution", "backtest", "dashboard", "live", "cli"]

[tool.ruff]
line-length = 100
target-version = "py311"
# 옛 엔진에 못 박힌(pin) 리포트 스크립트 아카이브 — 결론이 이미 났고 오늘 엔진 수치가
# 아니므로 품질검사 대상에서 제외한다(WAN-163). 코드·테스트는 감사·재현을 위해 보존된다.
extend-exclude = ["backtest/archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = [
    "main.py",
    "common",
    "config",
    "data",
    "strategy",
    "execution",
    "backtest",
    "dashboard",
    "live",
    "cli",
    "tests",
    "scripts",
    "qc",
]
# 옛 엔진 핀 리포트 아카이브는 strict 타입 검사에서 제외한다(WAN-163). 아카이브 모듈을
# import하는 검사 대상 코드는 없으므로(완전 분리) follow-imports로 되살아나지 않는다.
exclude = ['^backtest/archive/']

# QC 클라우드 전용 셸 — `AlgorithmImports`(QC SDK)가 로컬에 없어 타입 검사가 성립하지
# 않는다(WAN-181). 로컬에서 검증되는 로직은 전부 `qc.event_engine`(strict 검사 대상)에
# 있고 이 모듈은 QC 이벤트 번역만 담는다.
[[tool.mypy.overrides]]
module = ["qc.algorithm"]
ignore_errors = true

# ccxt/pandas/matplotlib/streamlit은 타입 스텁을 제공하지 않으므로 미싱 임포트를 허용한다.
[[tool.mypy.overrides]]
module = ["ccxt.*", "pandas.*", "matplotlib.*", "streamlit.*", "plotly.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# 아카이브된 옛 엔진 테스트는 수집하지 않는다(WAN-163). testpaths가 이미 tests/로
# 한정하지만, backtest/를 직접 지정해 돌려도 아카이브가 걸리지 않도록 명시한다.
norecursedirs = ["backtest/archive"]
